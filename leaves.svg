<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Points up from the origin. -->
    <path id="leaflet" vector-effect="non-scaling-stroke" d="M0 0 C-5 -12 -8 -28 -7 -40 L-9 -44 L-6 -46 L-7 -52 L-4 -54 L-4 -60 L0 -72 L4 -60 L4 -54 L7 -52 L6 -46 L9 -44 L7 -40 C8 -28 5 -12 0 0 Z M0 -3 L0 -64"/>
    <!-- Points right from the origin. -->
    <path id="leaf" vector-effect="non-scaling-stroke" d="M0 0 C15 -18 40 -20 60 0 C40 20 15 18 0 0 Z M2 0 C20 -2 40 -1 54 0 M20 -1 L27 -9 M33 -1 L40 -8 M20 1 L27 9 M33 1 L40 8"/>
  </defs>

  <!-- Cannabis leaf -->
  <g transform="translate(95 125) rotate(-18)">
    <use xlink:href="#leaflet"/>
    <use xlink:href="#leaflet" transform="rotate(-28) scale(.88)"/>
    <use xlink:href="#leaflet" transform="rotate(28) scale(.88)"/>
    <use xlink:href="#leaflet" transform="rotate(-58) scale(.68)"/>
    <use xlink:href="#leaflet" transform="rotate(58) scale(.68)"/>
    <use xlink:href="#leaflet" transform="rotate(-90) scale(.42)"/>
    <use xlink:href="#leaflet" transform="rotate(90) scale(.42)"/>
    <path d="M0 0 C3 14 1 30 -6 46"/>
  </g>

  <!-- Branch with alternating leaves -->
  <g transform="translate(250 30)">
    <path d="M0 0 C30 40 42 92 30 150"/>
    <use xlink:href="#leaf" transform="translate(14 22) rotate(-35) scale(.55)"/>
    <use xlink:href="#leaf" transform="translate(28 52) rotate(200) scale(.6)"/>
    <use xlink:href="#leaf" transform="translate(36 82) rotate(-15) scale(.65)"/>
    <use xlink:href="#leaf" transform="translate(37 112) rotate(185) scale(.6)"/>
    <use xlink:href="#leaf" transform="translate(32 140) rotate(10) scale(.5)"/>
  </g>

  <!-- Fern frond -->
  <g transform="translate(200 375) rotate(-22)">
    <path d="M0 0 C-4 -50 -2 -100 6 -150"/>
    <use xlink:href="#leaf" transform="translate(-1 -20) rotate(-35) scale(.42)"/>
    <use xlink:href="#leaf" transform="translate(-1 -20) rotate(215) scale(.42)"/>
    <use xlink:href="#leaf" transform="translate(-2 -45) rotate(-38) scale(.36)"/>
    <use xlink:href="#leaf" transform="translate(-2 -45) rotate(218) scale(.36)"/>
    <use xlink:href="#leaf" transform="translate(-2 -70) rotate(-40) scale(.3)"/>
    <use xlink:href="#leaf" transform="translate(-2 -70) rotate(220) scale(.3)"/>
    <use xlink:href="#leaf" transform="translate(0 -95) rotate(-42) scale(.24)"/>
    <use xlink:href="#leaf" transform="translate(0 -95) rotate(222) scale(.24)"/>
    <use xlink:href="#leaf" transform="translate(2 -118) rotate(-45) scale(.18)"/>
    <use xlink:href="#leaf" transform="translate(2 -118) rotate(225) scale(.18)"/>
    <use xlink:href="#leaf" transform="translate(5 -140) rotate(-75) scale(.14)"/>
  </g>

  <!-- Single leaves -->
  <use xlink:href="#leaf" transform="translate(40 290) rotate(-40) scale(1.1)"/>
  <use xlink:href="#leaf" transform="translate(320 360) rotate(-155) scale(.7)"/>

  <!-- Sprout -->
  <g transform="translate(160 205)">
    <path d="M0 0 C-2 -12 0 -22 4 -30"/>
    <path d="M4 -30 C-8 -40 -22 -36 -24 -26 C-12 -22 -2 -24 4 -30 Z"/>
    <path d="M4 -30 C12 -44 28 -44 32 -34 C22 -28 12 -28 4 -30 Z"/>
  </g>

  <!-- Curls -->
  <path d="M215 150 c6 -6 14 -2 12 6 c-2 8 -14 8 -16 0 c-3 -12 12 -20 22 -12"/>
  <path d="M350 200 c-6 -5 -13 0 -10 7 c3 7 14 5 15 -2 c2 -11 -12 -17 -21 -9"/>
  <path d="M30 30 c8 4 10 14 3 18 c-7 4 -15 -3 -11 -10"/>

  <!-- Flying saucer with its pilot -->
  <g transform="translate(195 82) rotate(-12)">
    <path d="M-24 0 C-24 -6 24 -6 24 0 C24 7 -24 7 -24 0 Z"/>
    <path d="M-24 0 C-12 3 12 3 24 0"/>
    <path d="M-11 -4 C-10 -18 10 -18 11 -4"/>
    <circle cx="0" cy="-8" r="3.5"/>
    <path d="M-1.5 -11 L-3 -13 M1.5 -11 L3 -13"/>
    <path d="M-7 9 L-12 20 M7 9 L12 20" stroke-dasharray="2 3"/>
    <g fill="#000" stroke="none">
      <circle cx="-1.3" cy="-8.4" r=".8"/>
      <circle cx="1.3" cy="-8.4" r=".8"/>
      <circle cx="-14" cy="2" r="1.2"/>
      <circle cx="0" cy="3.5" r="1.2"/>
      <circle cx="14" cy="2" r="1.2"/>
    </g>
  </g>

  <!-- Ringed planet; the ring's back half stops at the planet's edge -->
  <g transform="translate(60 360) rotate(-20)">
    <circle cx="0" cy="0" r="12"/>
    <path d="M-26 0 A26 7 0 0 0 26 0"/>
    <path d="M-26 0 A26 7 0 0 1 -14 -5.9 M14 -5.9 A26 7 0 0 1 26 0"/>
    <path d="M-6 -6 C-3 -8 1 -8 4 -7"/>
  </g>

  <!-- Heart -->
  <g transform="translate(296 268) rotate(-12) scale(1.4)">
    <path d="M0 7 C-9 0 -12 -7 -7 -11 C-4 -13 -1 -11 0 -8 C1 -11 4 -13 7 -11 C12 -7 9 0 0 7 Z"/>
    <path d="M-6 -7 C-6 -9 -5 -10 -3.5 -10"/>
  </g>

  <!-- Stars -->
  <path d="M125 291 C126 298 127 299 134 300 C127 301 126 302 125 309 C124 302 123 301 116 300 C123 299 124 298 125 291 Z"/>
  <path d="M375 32 C375.6 37 376 37.4 381 38 C376 38.6 375.6 39 375 44 C374.4 39 374 38.6 369 38 C374 37.4 374.4 37 375 32 Z"/>
  <path d="M355 142 L357 147.25 L362.6 147.5 L358.2 151 L359.7 156.5 L355 153.4 L350.3 156.5 L351.8 151 L347.4 147.5 L353 147.25 Z"/>

  <!-- Seeds -->
  <g fill="#000" stroke="none">
    <circle cx="140" cy="30" r="2"/>
    <circle cx="150" cy="40" r="1.5"/>
    <circle cx="370" cy="110" r="2"/>
    <circle cx="120" cy="370" r="1.8"/>
    <circle cx="130" cy="358" r="1.3"/>
    <circle cx="240" cy="210" r="1.5"/>
    <circle cx="20" cy="190" r="2"/>
  </g>
</svg>
